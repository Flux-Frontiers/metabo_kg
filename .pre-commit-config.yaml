repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: '^(docs|article)/.*\.(png|jpg|jpeg|gif|pdf)$|^\.[^/]+/|^data/.*\.(tsv|kgml)$'
      - id: debug-statements

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: .venv/bin/ty check src/
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
      # KG build + snapshot run only after ty and pytest pass (fail_fast above
      # aborts the run on any failure, so this never fires on broken code).
      - id: kg-index
        name: pycodekg + dockg build & snapshot
        entry: scripts/precommit_kg_index.sh
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline', '--exclude-files', '^\.[^/]+/|/\.metabokg/snapshots/']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
