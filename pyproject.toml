# pyproject.toml — MetaboKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
# Last Revision: 2026-08-01 00:00:00
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Quick install (pip)
# -------------------
#   pip install -e ".[dev]"             core + dev tools (pytest, ruff, ty, etc.)
#   pip install -e ".[viz]"             core + Streamlit/PyVis visualizer
#   pip install -e ".[viz3d]"           core + PyVista 3D visualizer
#   pip install -e ".[simulate]"        core + scipy ODE/FBA simulation
#   pip install -e ".[biopax]"          core + RDFLib BioPAX parser
#   pip install -e ".[all]"             everything above
#   pip install -e "."                  core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install --all-extras         everything
#   poetry install --extras "dev"       core + dev tools only
#   poetry install --extras "viz"       core + Streamlit/PyVis only
#   poetry install --extras "viz3d"     core + 3D visualizer only
#   poetry install --extras "simulate"  core + simulation only
#   poetry install --with kg            core + the dockg/pycodekg CLIs (maintainer tooling)
#   poetry install                      core runtime only
#
# First-time setup
# ----------------
#   python -m venv .venv
#   source .venv/bin/activate       # Windows: .venv\Scripts\activate
#   pip install -e ".[dev]"
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=metabokg           with coverage
#
# Build KG indices (after code changes)
# --------------------------------------
#   metabokg-build --data ./data/hsa_pathways

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "metabokg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "metabo-kg"
version = "0.11.0"
description = "Metabolic pathway parser and semantic knowledge graph with MCP support"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["metabolic-pathways", "knowledge-graph", "bioinformatics", "semantic-search", "mcp", "sbml", "kgml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # Upper-bounded: mcp 2.0 removed the bundled `mcp.server.fastmcp` module
    # (FastMCP was split out into the standalone `fastmcp` package) and rebuilt
    # mcp.server around new submodules. metabokg.mcp_tools.create_server imports
    # FastMCP from mcp, so an unbounded floor lets a clean install pull 2.x and
    # break `metabokg mcp` when the server is built. Lift this only alongside a
    # port to the standalone fastmcp package.
    "mcp>=1.0.0,<2",
    "numpy>=1.24.0",
    "sentence-transformers>=5.4.1",
    "watchdoc>=0.0.1",
    "kgmodule-utils[semantic,sqlite-vec]>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5.0",
    "ty>=0.0.41",
    "pre-commit>=4.0.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.4.0",
]
biopax   = ["rdflib>=6.0.0"]
simulate = ["scipy>=1.11.0"]
viz = [
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "pyvis>=0.3.2",
    "streamlit>=1.56.0",
]
viz3d = [
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    "pyvista>=0.44.0",
    "pyvistaqt>=0.11.0",
]
all = [
    "detect-secrets>=1.5.0",
    "ty>=0.0.41",
    "pre-commit>=4.0.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.4.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "param>=2.0.0",
    "PyQt5>=5.15.0",
    "pyvis>=0.3.2",
    "pyvista>=0.44.0",
    "pyvistaqt>=0.11.0",
    "rdflib>=6.0.0",
    "scipy>=1.11.0",
    "streamlit>=1.56.0",
]

# ---------------------------------------------------------------------------
# Maintainer tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# doc-kg and pycode-kg are tools this repo *runs*, not libraries it imports.
# Nothing under src/ imports either one. They are here because the
# "pycodekg + dockg build & snapshot" pre-commit hook rebuilds both indices,
# .mcp.json serves a `dockg` MCP server, and .claude/commands drive `pycodekg`.
#
# They used to live in the `kgdeps` and `all` extras. Extras are *published*
# metadata, so `pip install metabo-kg[all]` pulled two sibling KG packages into
# a consumer's environment for tooling they will never run -- and put the whole
# fleet into one resolution graph. A Poetry group is maintainer-facing: locked
# and installable, but never written into the wheel.
#
#   poetry install --with kg      # get the dockg / pycodekg CLIs into .venv/bin
#   poetry install                # default: group is optional, skipped
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
doc-kg = ">=0.21.1"
pycode-kg = ">=0.21.4"

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/metabo_kg"
Repository = "https://github.com/Flux-Frontiers/metabo_kg"

[project.scripts]
metabokg                = "metabokg.cli.main:cli"
metabokg-info           = "metabokg.cli:info_main"
metabokg-init           = "metabokg.cli:init_main"
metabokg-build          = "metabokg.cli:build_main"
metabokg-update         = "metabokg.cli:update_main"
metabokg-enrich         = "metabokg.cli:enrich_main"
metabokg-mcp            = "metabokg.cli:mcp_main"
metabokg-viz            = "metabokg.cli:viz_main"
metabokg-viz3d          = "metabokg.cli:viz3d_main"
metabokg-query          = "metabokg.cli:query_main"
metabokg-pack           = "metabokg.cli:pack_main"
metabokg-analyze        = "metabokg.cli:analyze_main"
metabokg-analyze-basic  = "metabokg.cli:analyze_basic_main"
metabokg-simulate       = "metabokg.cli:simulate_main"
metabokg-snapshot       = "metabokg.cli:snapshot_main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks embedded in Markdown as stable behaviour
# (0.15 gated it behind preview), so `ruff format --check .` starts rewriting
# prose docs. Measured here: 12 Markdown files would be reformatted. The
# snippets in docs/ and .claude/ are illustrative and deliberately aligned, so
# keep docs out of its reach; ftree_kg and doc_kg carry the same exclusion.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies (model, sqlite-vec)",
]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "broad-exception-caught",   # W0718
    "cell-var-from-loop",       # W0640
    "cyclic-import",            # R0401
    "import-outside-toplevel",  # C0415
    "undefined-variable",       # E0602
]

# ---------------------------------------------------------------------------
# MetaboKG / PyCodeKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
include = ["src", "scripts"]

[tool.dockg]
exclude = [
    ".dockg", ".pycodekg", ".git", ".pytest_cache", ".venv",
    "__pycache__", "bundles", "dist", "src", "venv",
]
